[package]
name = "mdre"
version = "0.2.5"
edition = "2021"

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = { version = "=2.12.2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "=0.17.16"
tokio = { version = "1", features = ["sync", "time"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }
tauri-plugin-single-instance = "2.5.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
